<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="An agent that designs accelerator chips and tests each iteration in simulation.">
  <title>Chip Builder</title>
  <link rel="stylesheet" href="/static/styles.css?v=3.0.0">
  <script src="/static/app.js?v=3.0.0" defer></script>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <h1>Chip Builder</h1>
      <p class="model" id="model-label">gpt-oss-20b</p>
    </header>

    <form class="brief" id="brief-form">
      <label for="goal">Design brief</label>
      <textarea id="goal" rows="2">Minimize p99 time-to-first-token without reducing throughput.</textarea>
      <div class="brief-footer">
        <p class="budget">Budget: 600 W · 85 °C · 650 mm² · up to 5 iterations</p>
        <button type="submit" id="start">Design chip</button>
      </div>
    </form>

    <p class="status" id="status" hidden></p>

    <section class="final" id="final" hidden>
      <h2>Final design</h2>
      <p class="summary" id="final-summary"></p>
      <div id="final-card"></div>
    </section>

    <section class="timeline" id="timeline" hidden>
      <div class="timeline-head">
        <h2>Iterations</h2>
        <ul class="legend" aria-label="Diagram legend">
          <li><span class="swatch compute"></span>Compute</li>
          <li><span class="swatch hbm"></span>HBM</li>
          <li><span class="swatch sbuf"></span>SRAM</li>
          <li><span class="swatch dma"></span>DMA</li>
          <li><span class="swatch changed"></span>Changed</li>
        </ul>
      </div>
      <div id="iterations"></div>
    </section>
  </main>
</body>
</html>
